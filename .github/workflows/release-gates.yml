name: Release Acceptance Gates
on:
  push:
    branches: [main, phase2-v0.2.0]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    name: structure + Phase 2 tests + npm build + Docker runtime
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate permanent repository structure
        run: |
          set -euo pipefail
          test -s backend/app/providers/projections/gleason.py
          test -s frontend/src/map2d/ProjectionMap.tsx
          test -s data/sources/gleason-book.yaml
          test -s docs/PHASE_2_REPORT.md
          for path in App.tsx package.json pyproject.toml main.py config.py capabilities.ts gleason-book.yaml; do test ! -e "$path"; done
      - name: Validate Phase 2 source policy
        run: |
          grep -q 'forward_inverse_locked: true' data/sources/gleason-book.yaml
          grep -q 'control_points: \[\]' data/sources/gleason-book.yaml
          grep -q '^0.2.0$' VERSION
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Backend tests
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -e '.[dev]' && pytest -q
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Frontend core tests
        working-directory: frontend
        run: npm run test:core
      - name: npm production build
        working-directory: frontend
        run: npm run build
      - name: Verify production PWA and offline pack
        working-directory: frontend
        run: test -s dist/index.html && test -s dist/sw.js && test -s dist/offline-packs/core-world-v1.json
      - name: Validate Docker Compose
        run: docker compose config
      - name: Build and start Docker stack
        run: docker compose up --build -d
      - name: Wait for backend readiness
        run: |
          for i in $(seq 1 90); do if curl --fail --silent http://127.0.0.1:8000/api/v1/ready >/tmp/ready.json; then break; fi; sleep 2; done
          jq -e '.status=="ready" and .database.reachable==true and .database.dialect=="postgresql"' /tmp/ready.json
      - name: Verify Phase 2 projection API
        run: |
          curl --fail --silent http://127.0.0.1:8000/api/v1/models/projections >/tmp/models.json
          jq -e 'length==2 and any(.[];.model_id=="gleason-historical") and any(.[];.model_id=="ae-north-pole")' /tmp/models.json
          curl --fail --silent -X POST http://127.0.0.1:8000/api/v1/projections/gleason-historical/forward -H 'content-type: application/json' -d '{"latitude":0,"longitude":90}' >/tmp/g.json
          jq -e '.output.x>0.499999 and .output.x<0.500001' /tmp/g.json
          curl --fail --silent http://127.0.0.1:8000/api/v1/sources/gleason >/tmp/source.json
          jq -e '.georeferencing.historical_scan=="not-embedded"' /tmp/source.json
      - name: Verify PostGIS
        run: test -n "$(docker compose exec -T db psql -U gleason -d gleason -tAc "SELECT extversion FROM pg_extension WHERE extname='postgis';" | tr -d '[:space:]')"
      - name: Verify Redis
        run: test "$(docker compose exec -T redis redis-cli ping | tr -d '\r')" = "PONG"
      - name: Verify frontend over Docker HTTP
        run: |
          for i in $(seq 1 60); do if curl --fail --silent http://127.0.0.1:8080/ >/tmp/index.html; then break; fi; sleep 2; done
          curl --fail --silent http://127.0.0.1:8080/offline-packs/core-world-v1.json >/tmp/pack.json
          jq -e '.pack_id=="core-world-v1"' /tmp/pack.json
      - name: Docker logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=500
      - name: Stop Docker stack
        if: always()
        run: docker compose down -v --remove-orphans || true
