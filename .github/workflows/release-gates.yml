name: Release Acceptance Gates
on:
  push:
    branches: [main, phase2-v0.2.0, phase3-v0.3.0]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    name: structure + release tests + npm build + Docker runtime
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate permanent repository structure
        run: |
          set -euo pipefail
          test -s backend/app/providers/projections/gleason.py
          test -s frontend/src/map2d/ProjectionMap.tsx
          test -s data/sources/gleason-book.yaml
          test -s docs/PHASE_2_REPORT.md
          for path in App.tsx package.json pyproject.toml main.py config.py capabilities.ts gleason-book.yaml; do test ! -e "$path"; done
      - name: Validate source policy and release version
        run: |
          grep -q 'forward_inverse_locked: true' data/sources/gleason-book.yaml
          grep -q 'control_points: \[\]' data/sources/gleason-book.yaml
          grep -Eq '^0\.(2\.0|3\.0-dev)$' VERSION
          if [ "${GITHUB_REF_NAME}" = "phase3-v0.3.0" ]; then
            grep -q '^0.3.0-dev$' VERSION
            test -s database/init/002_geographic_entities.sql
            test -s backend/app/api/geography_routes.py
            test -s backend/app/importers/geography.py
            test -s backend/app/services/offline_region_pack.py
            test -s frontend/src/offline/geographicSearch.ts
            test -s frontend/src/offline/regionPack.ts
            test -s frontend/src/search/GeographicSearchPanel.tsx
            test -s docs/PHASE_3_PLAN.md
          fi
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Backend tests
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -e '.[dev]' && pytest -q
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Frontend core tests
        working-directory: frontend
        run: npm run test:core
      - name: npm production build
        working-directory: frontend
        run: npm run build
      - name: Verify production PWA and offline pack
        working-directory: frontend
        run: test -s dist/index.html && test -s dist/sw.js && test -s dist/offline-packs/core-world-v1.json
      - name: Validate Docker Compose
        run: docker compose config
      - name: Build and start Docker stack
        run: docker compose up --build -d
      - name: Wait for backend readiness
        run: |
          for i in $(seq 1 90); do if curl --fail --silent http://127.0.0.1:8000/api/v1/ready >/tmp/ready.json; then break; fi; sleep 2; done
          jq -e '.status=="ready" and .database.reachable==true and .database.dialect=="postgresql"' /tmp/ready.json
      - name: Verify Phase 2 projection API regression
        run: |
          curl --fail --silent http://127.0.0.1:8000/api/v1/models/projections >/tmp/models.json
          jq -e 'length==2 and any(.[];.model_id=="gleason-historical") and any(.[];.model_id=="ae-north-pole")' /tmp/models.json
          curl --fail --silent -X POST http://127.0.0.1:8000/api/v1/projections/gleason-historical/forward -H 'content-type: application/json' -d '{"latitude":0,"longitude":90}' >/tmp/g.json
          jq -e '.output.x>0.499999 and .output.x<0.500001' /tmp/g.json
          curl --fail --silent http://127.0.0.1:8000/api/v1/sources/gleason >/tmp/source.json
          jq -e '.georeferencing.historical_scan=="not-embedded"' /tmp/source.json
      - name: Verify PostGIS
        run: |
          test -n "$(docker compose exec -T db psql -U gleason -d gleason -tAc "SELECT extversion FROM pg_extension WHERE extname='postgis';" | tr -d '[:space:]')"
      - name: Verify Phase 3 PostGIS schema and unified search
        run: |
          TABLE_EXISTS=$(docker compose exec -T db psql -U gleason -d gleason -tAc "SELECT to_regclass('public.geographic_entities') IS NOT NULL;" | tr -d '[:space:]')
          test "$TABLE_EXISTS" = "t"
          docker compose exec -T db psql -U gleason -d gleason <<'SQL'
          INSERT INTO geographic_entities (
            id, entity_type, name, name_ar, aliases, country_code,
            source_id, source_version, source_license, geom
          ) VALUES (
            'ci:qa-doha', 'city', 'Doha', 'الدوحة', '["Ad Dawhah"]'::jsonb, 'QA',
            'ci-test-fixture', '1', 'test-only', ST_SetSRID(ST_Point(51.5310, 25.2854), 4326)
          ) ON CONFLICT (id) DO UPDATE SET name = EXCLUDED.name;
          SQL
          curl --fail --silent --get http://127.0.0.1:8000/api/v1/search --data-urlencode 'q=Doha' --data-urlencode 'entity_type=city' >/tmp/search-en.json
          jq -e '.total>=1 and any(.results[];.id=="ci:qa-doha" and .entity_type=="city" and .provenance.source_license=="test-only")' /tmp/search-en.json
          curl --fail --silent --get http://127.0.0.1:8000/api/v1/search --data-urlencode 'q=الدوحة' >/tmp/search-ar.json
          jq -e '.total>=1 and any(.results[];.id=="ci:qa-doha")' /tmp/search-ar.json
      - name: Verify Phase 3 importer and region-pack export
        run: |
          docker compose exec -T backend python - <<'PY'
          import os
          from app.database import DatabaseManager
          from app.importers.geography import GeographicImportRecord, import_geographic_records
          db = DatabaseManager(os.environ['APP_DATABASE_URL'])
          record = GeographicImportRecord(
              id='ci:import:doha-airport', entity_type='airport', name='Doha Test Airport',
              aliases=['DTA'], country_code='QA', source_id='ci-import-fixture',
              source_version='1', source_license='test-only',
              geometry_geojson={'type':'Point','coordinates':[51.60,25.27]},
              metadata={'fixture': True},
          )
          summary = import_geographic_records(db, [record])
          assert summary.processed == 1 and summary.counts_by_type == {'airport': 1}
          PY
          curl --fail --silent --get http://127.0.0.1:8000/api/v1/geography/region-pack --data-urlencode 'region=QA' >/tmp/qa-pack.json
          jq -e '.manifest.region=="QA" and .manifest.entityCount>=2 and (.manifest.sha256|test("^[a-f0-9]{64}$")) and any(.entities[];.id=="ci:import:doha-airport" and .provenance.sourceLicense=="test-only")' /tmp/qa-pack.json
      - name: Verify Redis
        run: test "$(docker compose exec -T redis redis-cli ping | tr -d '\r')" = "PONG"
      - name: Verify frontend over Docker HTTP
        run: |
          for i in $(seq 1 60); do if curl --fail --silent http://127.0.0.1:8080/ >/tmp/index.html; then break; fi; sleep 2; done
          curl --fail --silent http://127.0.0.1:8080/offline-packs/core-world-v1.json >/tmp/pack.json
          jq -e '.pack_id=="core-world-v1"' /tmp/pack.json
      - name: Docker logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=500
      - name: Stop Docker stack
        if: always()
        run: docker compose down -v --remove-orphans || true
