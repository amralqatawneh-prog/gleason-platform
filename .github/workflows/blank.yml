name: Phase 1 Acceptance Gates

on:
  push:
    branches: [main, phase1-gate-fix]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acceptance:
    name: npm production build + Docker runtime
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select or reconstruct Phase 1 source tree
        shell: bash
        run: |
          set -euxo pipefail
          if [ -s backend/pyproject.toml ] && [ -s frontend/package.json ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
            exit 0
          fi

          echo "PROJECT_DIR=work" >> "$GITHUB_ENV"
          mkdir -p work/backend/app/api work/backend/app/services work/backend/tests
          mkdir -p work/frontend/src/offline work/frontend/src/platform work/frontend/src/shared work/frontend/tests work/frontend/public/icons work/frontend/mobile
          mkdir -p work/data/sources work/database/init work/docs work/scripts

          cp .env.example .gitignore CHANGELOG.md PROJECT_ARCHITECTURE.md README.md VERSION work/

          cp pyproject.toml work/backend/
          cp backend.Dockerfile work/backend/Dockerfile
          cp __init__.py work/backend/app/__init__.py
          touch work/backend/app/api/__init__.py work/backend/app/services/__init__.py
          cp router.py work/backend/app/api/router.py
          cp config.py database.py errors.py logging_config.py main.py middleware.py work/backend/app/
          cp capabilities.py work/backend/app/services/capabilities.py
          cp conftest.py test_api.py test_config.py test_database.py work/backend/tests/

          cp Dockerfile work/frontend/Dockerfile
          cp package.json capacitor.config.ts index.html nginx.conf tsconfig.app.json tsconfig.core.json tsconfig.json tsconfig.node.json vite.config.ts work/frontend/
          cp App.tsx api.ts i18n.ts main.tsx styles.css work/frontend/src/
          cp indexedDb.ts packManifest.ts work/frontend/src/offline/
          cp capabilities.ts work/frontend/src/platform/
          cp version.ts work/frontend/src/shared/
          cp capabilities.test.mjs offline-pack.test.mjs work/frontend/tests/
          cp manifest.webmanifest offline.html sw.js work/frontend/public/
          cp frontend/public/icons/icon-192.png frontend/public/icons/icon-512.png work/frontend/public/icons/
          printf '%s\n' '# Capacitor mobile shell' '' 'Native Android/iOS projects are generated in later phases; the web/PWA codebase is canonical.' > work/frontend/mobile/README.md

          cp gleason-book.yaml work/data/sources/
          cp docker-compose.yml work/
          cp database/init/001_postgis.sql work/database/init/

          for f in GIT_COMMIT.txt OFFLINE_ARCHITECTURE.md PHASE_1_CHECKSUMS.txt PHASE_1_REPORT.md SECURITY.md TEST_REPORT.md verification-results.json; do
            [ -f "$f" ] && cp "$f" work/docs/
          done
          [ -f verify_phase1.py ] && cp verify_phase1.py work/scripts/

          test -s work/frontend/package.json
          test -s work/backend/pyproject.toml
          test -s work/docker-compose.yml

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: cd "$PROJECT_DIR/frontend" && npm install --no-audit --no-fund

      - name: npm production build
        run: cd "$PROJECT_DIR/frontend" && npm run build

      - name: Verify production PWA artifacts
        run: |
          cd "$PROJECT_DIR/frontend"
          test -s dist/index.html
          test -s dist/manifest.webmanifest
          test -s dist/sw.js
          test -s dist/icons/icon-192.png
          test -s dist/icons/icon-512.png

      - name: Smoke-test production preview
        run: |
          cd "$PROJECT_DIR/frontend"
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/vite-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/tmp/index.html; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/manifest.webmanifest >/tmp/manifest.json
          grep -q '<div id="root"></div>' /tmp/index.html
          grep -q 'Gleason' /tmp/manifest.json

      - name: Validate Docker Compose
        run: cd "$PROJECT_DIR" && docker compose config

      - name: Build and start Docker stack
        run: cd "$PROJECT_DIR" && docker compose up --build -d

      - name: Wait for backend readiness and PostgreSQL binding
        run: |
          for i in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/ready >/tmp/ready.json; then break; fi
            sleep 2
          done
          cat /tmp/ready.json
          jq -e '.status == "ready" and .database.reachable == true and .database.dialect == "postgresql"' /tmp/ready.json

      - name: Verify PostGIS extension
        run: |
          cd "$PROJECT_DIR"
          VERSION=$(docker compose exec -T db psql -U gleason -d gleason -tAc "SELECT extversion FROM pg_extension WHERE extname='postgis';" | tr -d '[:space:]')
          test -n "$VERSION"
          echo "PostGIS=$VERSION"

      - name: Verify Redis
        run: |
          cd "$PROJECT_DIR"
          test "$(docker compose exec -T redis redis-cli ping | tr -d '\r')" = "PONG"

      - name: Verify frontend and PWA over Docker HTTP
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/ >/tmp/docker-index.html; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8080/manifest.webmanifest >/tmp/docker-manifest.json
          grep -q '<div id="root"></div>' /tmp/docker-index.html
          grep -q 'Gleason' /tmp/docker-manifest.json
          cd "$PROJECT_DIR"
          docker compose ps

      - name: Capture Docker logs on failure
        if: failure()
        run: cd "$PROJECT_DIR" && docker compose logs --no-color --tail=400

      - name: Stop Docker stack
        if: always()
        run: cd "$PROJECT_DIR" && docker compose down -v --remove-orphans || true

      - name: Normalize repository structure after successful gates
        if: success() && github.ref == 'refs/heads/phase1-gate-fix'
        shell: bash
        run: |
          set -euxo pipefail
          [ "$PROJECT_DIR" = "work" ] || exit 0
          cp .github/workflows/blank.yml /tmp/phase1-gates.yml
          rm -rf work/frontend/node_modules work/frontend/dist work/frontend/.phase1-test-build
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name work -exec rm -rf {} +
          shopt -s dotglob nullglob
          cp -a work/. .
          rm -rf work
          mkdir -p .github/workflows
          cp /tmp/phase1-gates.yml .github/workflows/phase1-gates.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: normalize Phase 1 repository structure"
          git push origin HEAD:phase1-gate-fix
