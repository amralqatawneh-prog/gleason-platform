services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: gleason
      POSTGRES_USER: gleason
      POSTGRES_PASSWORD: gleason_dev_only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gleason -d gleason"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_LOG_LEVEL: INFO
      APP_API_PREFIX: /api/v1
      APP_CORS_ORIGINS: http://localhost:8080
      DATABASE_URL: postgresql+psycopg://gleason:gleason_dev_only@db:5432/gleason
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
  redisdata:
